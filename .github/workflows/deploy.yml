name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: /api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --legacy-peer-deps
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # main -> production (168.144.21.44), staging -> staging (62.84.181.200).
    # Secrets resolve from the GitHub Environment, so a staging run cannot read
    # production values.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Write build env, pull and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Write .env for docker-compose build args — NEXT_PUBLIC_* baked into bundle
            # at BUILD time, so changing these needs a rebuild, not a restart.
            printf 'NEXT_PUBLIC_API_URL=%s\nNEXT_PUBLIC_SITE_URL=%s\nNEXT_PUBLIC_SITE_ENV=%s\n' \
              '${{ secrets.NEXT_PUBLIC_API_URL }}' \
              '${{ secrets.NEXT_PUBLIC_SITE_URL }}' \
              '${{ secrets.NEXT_PUBLIC_SITE_ENV }}' \
              > /opt/crafts-frontend/.env

            cd /opt/crafts-frontend
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            docker compose up -d --build

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 15
            curl -sf http://localhost:3000 || exit 1
            echo "Health check passed"
