services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Dev-only defaults; deploys pass real values from GitHub Environments.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_ENV: ${NEXT_PUBLIC_SITE_ENV:-development}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
